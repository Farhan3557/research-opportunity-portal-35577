<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">University Research Opportunity Portal</span>
      <button class="btn btn-light" onclick="showForm()">+ New Opportunity</button>
    </div>
  </nav>

  <div class="container">
    <div id="message"></div>

    <!-- Form -->
    <div id="formBox" class="card mb-4 d-none">
      <div class="card-body">
        <h5 id="formTitle">New Research Opportunity</h5>
        <form id="oppForm" novalidate>
          <input type="hidden" id="oppId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Title *</label>
              <input type="text" id="title" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Research Area *</label>
              <input type="text" id="researchArea" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Description *</label>
              <textarea id="description" rows="3" class="form-control"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Faculty Member *</label>
              <input type="text" id="facultyName" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Department *</label>
              <input type="text" id="department" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Required Skills *</label>
              <input type="text" id="requiredSkills" class="form-control" placeholder="e.g. Python, Machine Learning">
            </div>
            <div class="col-md-3">
              <label class="form-label">Positions *</label>
              <input type="number" id="positions" min="1" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Deadline *</label>
              <input type="date" id="deadline" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select id="status" class="form-select">
                <option>Open</option>
                <option>Closed</option>
              </select>
            </div>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" onclick="hideForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Details -->
    <div id="detailsBox" class="card mb-4 d-none">
      <div class="card-body" id="detailsBody"></div>
    </div>

    <!-- List -->
    <div class="card">
      <div class="card-body">
        <h5>All Opportunities</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th><th>Title</th><th>Area</th><th>Faculty</th>
                <th>Positions</th><th>Deadline</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
